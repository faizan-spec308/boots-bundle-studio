name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check backend/

      - name: Syntax check all modules
        run: |
          cd backend
          python -c "
          import ast, sys
          for f in ['monday_client.py', 'boots_crawler.py', 'image_composer.py', 'gemini_client.py', 'bundle_processor.py', 'app.py']:
              ast.parse(open(f).read())
              print(f'{f}: OK')
          "